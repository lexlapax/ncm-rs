[package]
name = "ncm-io"
description = "Bounded, integrity-checked NCM inspection artifact loading"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
safetensors = "=0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

# sha2 0.10.9 requires this feature for runtime-detected AArch64 SHA-256.
# Keep the existing Linux/x86 implementation unchanged.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
