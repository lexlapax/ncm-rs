[package]
name = "ncm-cli"
description = "Explicit-device NCM Sudoku inference CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
cpu = ["dep:ncm-backend-cuda", "ncm-backend-cuda/cpu"]
cuda = ["cpu", "ncm-backend-cuda/cuda"]
cuda-cudnn = ["cuda", "ncm-backend-cuda/cuda-cudnn"]
mlx = ["dep:ncm-backend-mlx", "ncm-backend-mlx/mlx"]
wmt14-experimental = ["ncm-model/wmt14-experimental"]

[dependencies]
ncm-core = { path = "../ncm-core" }
ncm-io = { path = "../ncm-io" }
ncm-model = { path = "../ncm-model" }
serde_json = "1"
ncm-backend-cuda = { path = "../ncm-backend-cuda", optional = true }
ncm-backend-mlx = { path = "../ncm-backend-mlx", optional = true }

[[bin]]
name = "ncm"
path = "src/main.rs"

[lints]
workspace = true
