[package]
name = "ncm-train"
description = "Native Rust training and fine-tuning for local-ncm-v1 codecs (RVQ/EMA) and generators on CPU, CUDA, and MLX"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
cpu = ["dep:candle-core", "dep:candle-nn"]
cuda = ["cpu", "candle-core/cuda", "candle-nn/cuda"]
mlx = ["dep:mlx-rs"]

[dependencies]
ncm-core = { path = "../ncm-core" }
ncm-io = { path = "../ncm-io" }
ncm-tokenizers = { path = "../ncm-tokenizers" }
safetensors = "=0.8.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
candle-core = { version = "=0.11.1", optional = true, default-features = false }
candle-nn = { version = "=0.11.1", optional = true, default-features = false }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-rs = { git = "https://github.com/oxiglade/mlx-rs", rev = "adf439bf5361d8a02955de7aaf651b0c45900945", optional = true, features = ["safetensors"] }

[dev-dependencies]
ncm-model = { path = "../ncm-model" }
ncm-backend-cuda = { path = "../ncm-backend-cuda", features = ["cpu"] }

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dev-dependencies]
ncm-backend-mlx = { path = "../ncm-backend-mlx" }

[lints]
workspace = true
