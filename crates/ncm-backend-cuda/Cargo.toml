[package]
name = "ncm-backend-cuda"
description = "Candle CPU/CUDA capability probes and candidate NCM tensor operations"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
cpu = ["dep:candle-core"]
cuda = ["cpu", "candle-core/cuda", "dep:candle-nn"]
cuda-cudnn = ["cuda", "dep:cudarc"]
cudnn-probe = ["cuda-cudnn", "candle-core/cudnn"]

[dependencies]
ncm-core = { path = "../ncm-core" }
candle-core = { version = "=0.11.1", optional = true, default-features = false }
# Same pinned runtime for FP32 CUDA norms, softmax and rotary operations.
candle-nn = { version = "=0.11.1", optional = true, default-features = false, features = ["cuda"] }
cudarc = { version = "=0.19.10", optional = true, default-features = false, features = ["cudnn", "dynamic-linking", "cuda-version-from-build-system"] }

[dev-dependencies]
ncm-tokenizers = { path = "../ncm-tokenizers" }
safetensors = "=0.8.0"
ncm-model = { path = "../ncm-model" }
ncm-io = { path = "../ncm-io" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

