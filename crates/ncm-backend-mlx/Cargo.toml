[package]
name = "ncm-backend-mlx"
description = "Native MLX backend for the shared NCM codec on Apple Silicon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
mlx = ["dep:mlx-rs", "dep:ncm-core", "dep:ncm-io", "dep:safetensors"]
wmt14-experimental = ["ncm-model/wmt14-experimental"]
lm1b-experimental = ["ncm-model/lm1b-experimental"]

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-rs = { git = "https://github.com/oxiglade/mlx-rs", rev = "adf439bf5361d8a02955de7aaf651b0c45900945", optional = true, features = ["safetensors"] }
ncm-core = { path = "../ncm-core", optional = true }
ncm-io = { path = "../ncm-io", optional = true }
safetensors = { version = "=0.8.0", optional = true }

[dev-dependencies]
ncm-tokenizers = { path = "../ncm-tokenizers" }
ncm-model = { path = "../ncm-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[example]]
name = "mlx_probe"
required-features = ["mlx"]

[[example]]
name = "mlx_load_probe"
required-features = ["mlx"]

[[example]]
name = "mlx_codec_trace"
required-features = ["mlx"]

[[example]]
