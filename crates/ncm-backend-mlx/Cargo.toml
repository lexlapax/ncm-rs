[package]
name = "ncm-backend-mlx"
description = "Candidate MLX operators for NCM on Apple Silicon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
default = []
mlx = ["dep:mlx-rs", "dep:ncm-io", "dep:safetensors"]

[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
mlx-rs = { git = "https://github.com/oxiglade/mlx-rs", rev = "adf439bf5361d8a02955de7aaf651b0c45900945", optional = true, features = ["safetensors"] }
ncm-io = { path = "../ncm-io", optional = true }
safetensors = { version = "=0.8.0", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[[example]]
name = "mlx_probe"
required-features = ["mlx"]

[[example]]
name = "mlx_load_probe"
required-features = ["mlx"]

[lints]
workspace = true
