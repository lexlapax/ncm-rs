name: Rust and CPU reference CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: CPU fixtures / Rust ${{ matrix.rust }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust: ["1.88.0", stable]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo test --workspace --features ncm-backend-cuda/cpu --locked
      - run: cargo run -p ncm-cli --locked

  quality:
    name: Formatting, Clippy and documentation (no GPU validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --features ncm-backend-cuda/cpu --locked -- -D warnings
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings
      - run: python3 -m unittest discover -s tools/bench -v
      - run: python3 -m py_compile tools/reference/operators.py tools/bench/compare.py
      - run: git diff --exit-code
