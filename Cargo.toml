[workspace]
resolver = "3"
members = [
    "crates/ncm-core",
    "crates/ncm-model",
    "crates/ncm-tokenizers",
    "crates/ncm-io",
    "crates/ncm-backend-cuda",
    "crates/ncm-backend-mlx",
    "crates/ncm-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/lexlapax/ncm-rs"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
